# GitLab CI 파이프라인 샘플: Maven Spring Boot -> Dependency-Track
#
# [사전 준비]
# GitLab 프로젝트 Settings > CI/CD > Variables 에 아래 변수를 등록하세요:
# - DTRACK_API_URL: https://dtrack.club012.com/api
# - DTRACK_API_KEY: <Dependency-Track에서 발급받은 API 키> (Masked 설정 권장)

stages:
  - build
  - sbom

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .m2/repository

# 1. 빌드 및 CycloneDX SBOM 생성
build-and-generate-sbom:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  script:
    # pom.xml에 cyclonedx-maven-plugin이 등록되어 있으면 package 단계에서 자동 생성됨
    - mvn clean package -DskipTests
    # 플러그인이 pom.xml에 등록되어 있지 않은 경우 아래 명령어로 직접 생성 가능:
    # - mvn org.cyclonedx:cyclonedx-maven-plugin:2.8.0:makeAggregateBom -DoutputFormat=json -DoutputName=bom
  artifacts:
    name: "sbom-${CI_COMMIT_REF_SLUG}"
    paths:
      - target/bom.json
    expire_in: 1 day

# 2. Dependency-Track API로 SBOM 전송
upload-sbom-to-dtrack:
  stage: sbom
  image: curlimages/curl:latest
  needs:
    - build-and-generate-sbom
  script:
    - echo "Uploading SBOM to Dependency-Track: ${DTRACK_API_URL}"
    - |
      HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" -X POST "${DTRACK_API_URL}/v1/bom" \
        -H "X-Api-Key: ${DTRACK_API_KEY}" \
        -H "Content-Type: multipart/form-data" \
        -F "autoCreate=true" \
        -F "projectName=${CI_PROJECT_NAME}" \
        -F "projectVersion=${CI_COMMIT_REF_NAME}" \
        -F "bom=@target/bom.json")
      
      echo "Response HTTP Status: ${HTTP_STATUS}"
      cat response.txt && echo ""
      
      if [ "${HTTP_STATUS}" -ne 200 ]; then
        echo "Error: SBOM upload failed with status ${HTTP_STATUS}"
        exit 1
      fi
