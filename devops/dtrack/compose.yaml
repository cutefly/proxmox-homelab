name: Dependency-Track

services:
  apiserver:
    image: ghcr.io/dependencytrack/apiserver:${DTRACK_VERSION:-5.2.0}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2g
    environment:
      DT_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/dtrack"
      DT_DATASOURCE_USERNAME: "dtrack"
      DT_DATASOURCE_PASSWORD: "dtrack"
    ports:
    # - "127.0.0.1:8080:8080"
    - "${PORT_BACKEND:-8081}:8080"
    volumes:
    # - "apiserver-data:/data"
    - "./volumes/dtrack:/data"
    restart: unless-stopped

  frontend:
    image: ghcr.io/dependencytrack/frontend:5.2.0
    environment:
      # API_BASE_URL: "http://localhost:8080"
      API_BASE_URL: "${API_BASE_URL:-https://dtrack.club012.com}"
    ports:
    # - "127.0.0.1:8081:8080"
    - "${PORT_FRONTEND:-8080}:8080"
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-dtrack}"
      POSTGRES_USER: "${POSTGRES_USER:-dtrack}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-dtrack}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 3
    volumes:
    - "postgres-data:/var/lib/postgresql"

volumes:
  # apiserver-data: {}
  postgres-data: {}